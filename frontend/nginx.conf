server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 500M;

  # React Router support
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Registry service API
  location /api/v1/ {
    proxy_pass http://registry-svc:8000/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Streaming service API
  location /api/streaming/v1/ {
    proxy_pass http://streaming-svc:8000/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Analytics service API
  location /api/analytics/v1/ {
    proxy_pass http://analytics-svc:8000/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Analytics WebSocket (real-time alerts)
  location /ws/alerts {
    proxy_pass http://analytics-svc:8000/ws/alerts;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # HLS video segments (served from shared volume)
  location /hls/ {
    alias /app/hls/;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Access-Control-Allow-Origin "*";
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    types {
      application/vnd.apple.mpegurl m3u8;
      video/mp2t ts;
    }
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
}
